<body>

  <div class="payment-card">

    <div class="brand">CEZOO</div>

    <div class="amount-label">AMOUNT TO PAY</div>
    <div class="amount">₹1</div>

    <div class="merchant">
      <div class="merchant-title">PAYING TO</div>
      <div class="merchant-name">Cezonal Solutions Pvt Ltd</div>
      <div class="upi-id">cezonalsolutionspvtltd@ybl</div>
    </div>

    <button
      class="phonepe-btn"
      type="button"
      onclick="openPhonePe()"
    >
      Pay ₹1 with PhonePe
    </button>

    <div class="note">
      You will be redirected to a UPI app to complete the payment.
    </div>

  </div>


  <script>
    function openPhonePe() {

      const upiId = "cezonalsolutionspvtltd@ybl";
      const payeeName = "Cezonal Solutions Pvt Ltd";
      const amount = "1.00";

      const transactionNote = "CEZOO Test Payment";

      const upiUrl =
        "upi://pay" +
        "?pa=" + encodeURIComponent(upiId) +
        "&pn=" + encodeURIComponent(payeeName) +
        "&am=" + encodeURIComponent(amount) +
        "&cu=INR" +
        "&tn=" + encodeURIComponent(transactionNote);

      // Open installed UPI app / chooser
      window.location.href = upiUrl;
    }
  </script>
